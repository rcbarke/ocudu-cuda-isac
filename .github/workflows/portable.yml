# Portable checks on a hosted CPU runner: the S0.1 environment gate, the source pins, the unit
# suite and the replay fixture. Simulation and native gates need lab hardware and run there with
# `make accept-s0` and the S1 commands in docs/dev.
name: portable

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: core profile on Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the declared floor. 3.12 is the lab interpreter on Ubuntu 24.04.
        python: ["3.11", "3.12", "3.13"]
    steps:
      # The three ext/ sources stay unfetched. These checks read the pins, not the source trees.
      - name: Check out the parent repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Select Python ${{ matrix.python }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Create the isac environment
        run: make env

      - name: Verify the core profile
        run: isac/bin/python scripts/verify_environment.py --profile core --report build/core-env.json

      # The pinned NumPy needs Python 3.12 or newer. With it, no array-contract test is skipped.
      - name: Install the pinned NumPy
        if: matrix.python == '3.12'
        run: isac/bin/python -m pip install --constraint environments/full-constraints.txt numpy

      - name: Check the pins, run the unit suite and replay the fixture
        run: |
          source isac/bin/activate
          make check

      - name: Keep the environment report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: core-env-python-${{ matrix.python }}
          path: build/core-env.json
          if-no-files-found: warn
